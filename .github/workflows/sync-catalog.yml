name: 신규 카드 확인
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node sync-catalog.mjs
      - name: 결과 올리기
        run: |
          git config user.name "cardfit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-additions.json known-cg-ids.json
          if git diff --cached --quiet; then
            echo "변화 없음"
          else
            git commit -m "카드고릴라 신규 카드 반영"
            git push
          fi
