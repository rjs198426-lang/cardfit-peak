name: 피킹률 다시 계산
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recalc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node recalculate.mjs --batch 50
      - name: 결과 올리기
        run: |
          git config user.name "cardfit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peak-feed.json
          if git diff --cached --quiet; then
            echo "변화 없음"
          else
            git commit -m "피킹률 50장 다시 계산"
            git push
          fi
